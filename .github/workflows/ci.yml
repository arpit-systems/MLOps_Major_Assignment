name: MLOps CI

on:
  push:

jobs:
  check_working_repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Training
        run: |
          python train.py

      - name: Run Testing
        run: |
          python test.py